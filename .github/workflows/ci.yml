name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Set up Node.js
      run: apk add --no-cache nodejs npm
    - name: Install dependencies
      run: |
        if [ -f package.json ]; then
          npm install
        fi
    - name: Run tests
      run: |
        if [ -f package.json ]; then
          npm test
        fi
